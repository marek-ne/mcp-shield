[package]
name = "mcp-shield"
version = "0.3.3"
edition = "2021"
description = "Enterprise Local-First MCP Runtime Security Shim, Secret Broker & Policy Enforcement"
license = "MIT"
repository = "https://github.com/marek-ne/mcp-shield"
homepage = "https://github.com/marek-ne/mcp-shield"
documentation = "https://github.com/marek-ne/mcp-shield#readme"
exclude = ["testenv"]

[dependencies]
tokio = { version = "1.44", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs = "6.0"
aho-corasick = "1.1"
regex = "1.11"
urlencoding = "2.1"
keyring = "2.3"
aes-gcm = { version = "0.10", features = ["getrandom"] }
argon2 = "0.5"
anyhow = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1.11", features = ["v4"] }
sha2 = "0.10"
hmac = "0.12"
ed25519-dalek = { version = "2", features = ["rand_core"] }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Foundation",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
